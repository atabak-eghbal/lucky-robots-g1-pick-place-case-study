<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="420"
  viewBox="0 0 900 420"
  role="img"
  aria-label="Architecture diagram showing orchestration, policy, controller, ONNX policies, and MuJoCo simulation with a vision observer input."
>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b" />
    </marker>
    <style>
      .box {
        fill: #ffffff;
        stroke: #94a3b8;
        stroke-width: 1.5;
      }
      .title {
        font: 600 16px "Inter", "Segoe UI", sans-serif;
        fill: #0f172a;
      }
      .subtitle {
        font: 500 12px "Inter", "Segoe UI", sans-serif;
        fill: #475569;
      }
      .arrow {
        stroke: #64748b;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect class="box" x="260" y="20" width="380" height="60" rx="12" />
  <text class="title" x="450" y="55" text-anchor="middle">Runtime Orchestrator</text>

  <rect class="box" x="260" y="105" width="380" height="70" rx="12" />
  <text class="title" x="450" y="140" text-anchor="middle">Policy Layer</text>
  <text class="subtitle" x="450" y="160" text-anchor="middle">FSM / Visual Oracle</text>

  <rect class="box" x="260" y="200" width="380" height="60" rx="12" />
  <text class="title" x="450" y="235" text-anchor="middle">Controller Layer</text>

  <rect class="box" x="260" y="285" width="380" height="60" rx="12" />
  <text class="title" x="450" y="320" text-anchor="middle">ONNX Walker / ONNX Reacher</text>

  <rect class="box" x="260" y="355" width="380" height="50" rx="12" />
  <text class="title" x="450" y="385" text-anchor="middle">MuJoCo Simulation</text>

  <rect class="box" x="40" y="120" width="180" height="60" rx="12" />
  <text class="title" x="130" y="150" text-anchor="middle">Vision Observer</text>

  <line class="arrow" x1="450" y1="80" x2="450" y2="105" />
  <line class="arrow" x1="450" y1="175" x2="450" y2="200" />
  <line class="arrow" x1="450" y1="260" x2="450" y2="285" />
  <line class="arrow" x1="450" y1="345" x2="450" y2="355" />

  <line class="arrow" x1="220" y1="150" x2="260" y2="140" />
</svg>
