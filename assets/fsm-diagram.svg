<svg
  xmlns="http://www.w3.org/2000/svg"
  width="520"
  height="760"
  viewBox="0 0 520 760"
  role="img"
  aria-label="Finite-state machine diagram showing pick-and-place sequencing and key transition labels."
>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b" />
    </marker>
    <style>
      .state {
        fill: #ffffff;
        stroke: #94a3b8;
        stroke-width: 1.5;
      }
      .label {
        font: 600 13px "Inter", "Segoe UI", sans-serif;
        fill: #0f172a;
      }
      .arrow {
        stroke: #64748b;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
      .note {
        font: 500 11px "Inter", "Segoe UI", sans-serif;
        fill: #475569;
      }
    </style>
  </defs>

  <rect class="state" x="110" y="20" width="300" height="34" rx="10" />
  <text class="label" x="260" y="42" text-anchor="middle">SETTLE</text>

  <rect class="state" x="110" y="80" width="300" height="34" rx="10" />
  <text class="label" x="260" y="102" text-anchor="middle">APPROACH_SOURCE</text>

  <rect class="state" x="110" y="140" width="300" height="34" rx="10" />
  <text class="label" x="260" y="162" text-anchor="middle">HOVER_SOURCE</text>

  <rect class="state" x="110" y="200" width="300" height="34" rx="10" />
  <text class="label" x="260" y="222" text-anchor="middle">DESCEND_SOURCE</text>

  <rect class="state" x="110" y="260" width="300" height="34" rx="10" />
  <text class="label" x="260" y="282" text-anchor="middle">CLOSE_GRIP</text>

  <rect class="state" x="110" y="320" width="300" height="34" rx="10" />
  <text class="label" x="260" y="342" text-anchor="middle">LIFT_SOURCE</text>

  <rect class="state" x="110" y="380" width="300" height="34" rx="10" />
  <text class="label" x="260" y="402" text-anchor="middle">APPROACH_TARGET</text>

  <rect class="state" x="110" y="440" width="300" height="34" rx="10" />
  <text class="label" x="260" y="462" text-anchor="middle">HOVER_TARGET</text>

  <rect class="state" x="110" y="500" width="300" height="34" rx="10" />
  <text class="label" x="260" y="522" text-anchor="middle">LOWER_TARGET</text>

  <rect class="state" x="110" y="560" width="300" height="34" rx="10" />
  <text class="label" x="260" y="582" text-anchor="middle">OPEN_GRIP</text>

  <rect class="state" x="110" y="620" width="300" height="34" rx="10" />
  <text class="label" x="260" y="642" text-anchor="middle">RETRACT</text>

  <rect class="state" x="110" y="680" width="300" height="34" rx="10" />
  <text class="label" x="260" y="702" text-anchor="middle">DONE</text>

  <line class="arrow" x1="260" y1="54" x2="260" y2="80" />
  <line class="arrow" x1="260" y1="114" x2="260" y2="140" />
  <line class="arrow" x1="260" y1="174" x2="260" y2="200" />
  <line class="arrow" x1="260" y1="234" x2="260" y2="260" />
  <line class="arrow" x1="260" y1="294" x2="260" y2="320" />
  <line class="arrow" x1="260" y1="354" x2="260" y2="380" />
  <line class="arrow" x1="260" y1="414" x2="260" y2="440" />
  <line class="arrow" x1="260" y1="474" x2="260" y2="500" />
  <line class="arrow" x1="260" y1="534" x2="260" y2="560" />
  <line class="arrow" x1="260" y1="594" x2="260" y2="620" />
  <line class="arrow" x1="260" y1="654" x2="260" y2="680" />

  <text class="note" x="410" y="70">debounce</text>
  <text class="note" x="410" y="230">freeze vision estimate</text>
  <text class="note" x="410" y="310">attach</text>
  <text class="note" x="410" y="430">timeout fallback</text>
  <text class="note" x="410" y="590">release</text>
</svg>
