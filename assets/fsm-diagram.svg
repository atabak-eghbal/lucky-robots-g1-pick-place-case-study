<svg
  xmlns="http://www.w3.org/2000/svg"
  width="560"
  height="760"
  viewBox="0 0 560 760"
  role="img"
  aria-label="Finite-state machine diagram showing the pick-and-place lifecycle with key annotations."
>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#5f6b7a" />
    </marker>
    <style>
      .state {
        fill: #ffffff;
        stroke: #e1e5ea;
        stroke-width: 1.5;
      }
      .label {
        font: 600 13px "Inter", "Segoe UI", sans-serif;
        fill: #161b22;
      }
      .note {
        font: 500 11px "Inter", "Segoe UI", sans-serif;
        fill: #5f6b7a;
      }
      .arrow {
        stroke: #5f6b7a;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect class="state" x="110" y="20" width="340" height="36" rx="10" />
  <text class="label" x="280" y="43" text-anchor="middle">SETTLE</text>

  <rect class="state" x="110" y="80" width="340" height="36" rx="10" />
  <text class="label" x="280" y="103" text-anchor="middle">APPROACH_SOURCE</text>

  <rect class="state" x="110" y="140" width="340" height="36" rx="10" />
  <text class="label" x="280" y="163" text-anchor="middle">HOVER_SOURCE</text>

  <rect class="state" x="110" y="200" width="340" height="36" rx="10" />
  <text class="label" x="280" y="223" text-anchor="middle">DESCEND_SOURCE</text>

  <rect class="state" x="110" y="260" width="340" height="36" rx="10" />
  <text class="label" x="280" y="283" text-anchor="middle">CLOSE_GRIP</text>

  <rect class="state" x="110" y="320" width="340" height="36" rx="10" />
  <text class="label" x="280" y="343" text-anchor="middle">LIFT_SOURCE</text>

  <rect class="state" x="110" y="380" width="340" height="36" rx="10" />
  <text class="label" x="280" y="403" text-anchor="middle">APPROACH_TARGET</text>

  <rect class="state" x="110" y="440" width="340" height="36" rx="10" />
  <text class="label" x="280" y="463" text-anchor="middle">HOVER_TARGET</text>

  <rect class="state" x="110" y="500" width="340" height="36" rx="10" />
  <text class="label" x="280" y="523" text-anchor="middle">LOWER_TARGET</text>

  <rect class="state" x="110" y="560" width="340" height="36" rx="10" />
  <text class="label" x="280" y="583" text-anchor="middle">OPEN_GRIP</text>

  <rect class="state" x="110" y="620" width="340" height="36" rx="10" />
  <text class="label" x="280" y="643" text-anchor="middle">RETRACT</text>

  <rect class="state" x="110" y="680" width="340" height="36" rx="10" />
  <text class="label" x="280" y="703" text-anchor="middle">DONE</text>

  <line class="arrow" x1="280" y1="56" x2="280" y2="80" />
  <line class="arrow" x1="280" y1="116" x2="280" y2="140" />
  <line class="arrow" x1="280" y1="176" x2="280" y2="200" />
  <line class="arrow" x1="280" y1="236" x2="280" y2="260" />
  <line class="arrow" x1="280" y1="296" x2="280" y2="320" />
  <line class="arrow" x1="280" y1="356" x2="280" y2="380" />
  <line class="arrow" x1="280" y1="416" x2="280" y2="440" />
  <line class="arrow" x1="280" y1="476" x2="280" y2="500" />
  <line class="arrow" x1="280" y1="536" x2="280" y2="560" />
  <line class="arrow" x1="280" y1="596" x2="280" y2="620" />
  <line class="arrow" x1="280" y1="656" x2="280" y2="680" />

  <text class="note" x="420" y="104">debounce</text>
  <text class="note" x="420" y="170">timeout fallback</text>
  <text class="note" x="420" y="244">freeze visual estimate</text>
  <text class="note" x="420" y="283">attach</text>
  <text class="note" x="420" y="524">timeout fallback</text>
  <text class="note" x="420" y="583">release</text>
</svg>
