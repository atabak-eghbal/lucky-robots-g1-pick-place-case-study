<svg
  xmlns="http://www.w3.org/2000/svg"
  width="700"
  height="320"
  viewBox="0 0 700 320"
  role="img"
  aria-label="Heading error curve showing rapid turn then asymptotic slowdown near alignment."
>
  <defs>
    <style>
      .axis {
        stroke: #cbd5e1;
        stroke-width: 1.5;
      }
      .grid {
        stroke: #e5e7eb;
        stroke-width: 1;
      }
      .line {
        stroke: #1f6feb;
        stroke-width: 3;
        fill: none;
      }
      .label {
        font: 500 12px "Inter", "Segoe UI", sans-serif;
        fill: #5f6b7a;
      }
      .note {
        font: 600 12px "Inter", "Segoe UI", sans-serif;
        fill: #1f6feb;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="320" fill="#ffffff" />

  <line class="axis" x1="60" y1="40" x2="60" y2="260" />
  <line class="axis" x1="60" y1="260" x2="660" y2="260" />

  <line class="grid" x1="60" y1="100" x2="660" y2="100" />
  <line class="grid" x1="60" y1="160" x2="660" y2="160" />
  <line class="grid" x1="60" y1="220" x2="660" y2="220" />

  <path class="line" d="M60,70 C120,190 220,220 320,235 S520,248 660,252" />

  <text class="note" x="130" y="110">Phase 1: strong clockwise turn</text>
  <text class="note" x="260" y="190">Phase 2: target corridor approach</text>
  <text class="note" x="360" y="248">Asymptotic slowdown near desired heading</text>

  <text class="label" x="30" y="50" text-anchor="end">Heading error</text>
  <text class="label" x="660" y="290" text-anchor="end">Time</text>
</svg>
