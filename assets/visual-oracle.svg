<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="220"
  viewBox="0 0 1100 220"
  role="img"
  aria-label="Visual Oracle pipeline from camera input to frozen target estimate."
>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b" />
    </marker>
    <style>
      .box {
        fill: #ffffff;
        stroke: #94a3b8;
        stroke-width: 1.5;
      }
      .label {
        font: 600 13px "Inter", "Segoe UI", sans-serif;
        fill: #0f172a;
      }
      .sub {
        font: 500 11px "Inter", "Segoe UI", sans-serif;
        fill: #475569;
      }
      .arrow {
        stroke: #64748b;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect class="box" x="20" y="60" width="140" height="70" rx="12" />
  <text class="label" x="90" y="88" text-anchor="middle">Camera</text>
  <text class="sub" x="90" y="106" text-anchor="middle">RGB / Depth</text>

  <rect class="box" x="180" y="60" width="140" height="70" rx="12" />
  <text class="label" x="250" y="88" text-anchor="middle">Red Cylinder</text>
  <text class="sub" x="250" y="106" text-anchor="middle">Mask</text>

  <rect class="box" x="340" y="60" width="150" height="70" rx="12" />
  <text class="label" x="415" y="88" text-anchor="middle">Depth</text>
  <text class="sub" x="415" y="106" text-anchor="middle">Back-Projection</text>

  <rect class="box" x="510" y="60" width="150" height="70" rx="12" />
  <text class="label" x="585" y="88" text-anchor="middle">World Coord</text>
  <text class="sub" x="585" y="106" text-anchor="middle">Estimate</text>

  <rect class="box" x="680" y="60" width="130" height="70" rx="12" />
  <text class="label" x="745" y="88" text-anchor="middle">EMA</text>
  <text class="sub" x="745" y="106" text-anchor="middle">Smoothing</text>

  <rect class="box" x="830" y="60" width="130" height="70" rx="12" />
  <text class="label" x="895" y="88" text-anchor="middle">Frozen</text>
  <text class="sub" x="895" y="106" text-anchor="middle">Estimate</text>

  <rect class="box" x="980" y="60" width="100" height="70" rx="12" />
  <text class="label" x="1030" y="86" text-anchor="middle">FSM</text>
  <text class="sub" x="1030" y="104" text-anchor="middle">Source Target</text>

  <line class="arrow" x1="160" y1="95" x2="180" y2="95" />
  <line class="arrow" x1="320" y1="95" x2="340" y2="95" />
  <line class="arrow" x1="490" y1="95" x2="510" y2="95" />
  <line class="arrow" x1="660" y1="95" x2="680" y2="95" />
  <line class="arrow" x1="810" y1="95" x2="830" y2="95" />
  <line class="arrow" x1="960" y1="95" x2="980" y2="95" />
</svg>
